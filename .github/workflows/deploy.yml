name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets this be re-run manually from the Actions tab without a new commit.
  workflow_dispatch:

# Only one deploy at a time; a push mid-deploy waits for the current run
# rather than racing it, but never cancels a deploy already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install, build, and upload the site
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
